# E09 — Release workflow
# Triggered by pushing a version tag (v*)
# Produces: quality-gate report + SBOM + adversarial summary + Docker image digests

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: |
          pip install -e ".[api,dev]"
          pip install ezdxf reportlab Pillow svgwrite
          npm ci

      - name: Full test suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Quality gate
        run: |
          npm run validate:week21
          python scripts/enterprise/check_quality_gate.py --fail-on-blocked

      - name: Adversarial suite
        run: |
          npm run test:week22
          npm run test:week23

      - name: Release checklist
        run: python scripts/enterprise/release_check.py --version "${{ github.ref_name }}"

      # SBOM generation via Syft (if available)
      - name: Generate SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: architectural-planning-platform-${{ github.ref_name }}.sbom.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            bar-association-hall/standard/quality-gate-report.json
            bar-association-hall/standard/week23-adversarial-expansion-report.json
            bar-association-hall/standard/week25-performance-report.json
            bar-association-hall/standard/week27-integrated-release-report.json
            *.sbom.json
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Architectural Planning Platform ${{ github.ref_name }}

            **Quality Gate:** See attached `quality-gate-report.json`
            **Adversarial Suite:** 30/30 known defects detected (see `week23-adversarial-expansion-report.json`)
            **Geometry Authority:** Remains exclusively in Python workers

            > ⚠️ This is a preliminary-review package only.
            > Professional architectural, structural, fire, accessibility, and statutory review remain mandatory.
            > This software does not certify construction readiness or permit issuability.
          files: |
            bar-association-hall/standard/quality-gate-report.json
            bar-association-hall/standard/week25-performance-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
