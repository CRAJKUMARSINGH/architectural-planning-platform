# Sample GitHub Actions workflow for Advocate-Chambers Enterprise
# Place at: .github/workflows/ci.yml
# Adjust Python/Node versions and paths to match the real repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          # add real requirements when available
          # pip install -r services/api/requirements.txt

      - name: Lint Python
        run: |
          ruff check scripts services packages || true
          ruff format --check scripts services packages || true

      - name: Typecheck Web
        run: npm run typecheck:web

  unit-and-domain:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install
        run: |
          npm ci
          python -m pip install --upgrade pip
          # pip install -r requirements...

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Selected domain validation
        run: |
          # Keep the list focused on critical gates
          npm run validate:week21 || true
          npm run validate:week23 || true
          npm run test:week23 || true

  adversarial-and-quality-gate:
    runs-on: ubuntu-latest
    needs: unit-and-domain
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # install project deps

      - name: Adversarial suite
        run: |
          npm run test:week22 || true
          npm run test:week23 || true

      - name: Quality gate
        run: |
          npm run validate:week21 || true
          # Fail the job if the gate reports BLOCKED or critical false negatives
          # Example:
          # python scripts/quality_gate.py validate --fail-on-blocked

  # Optional: performance smoke on main only
  performance-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: adversarial-and-quality-gate
    steps:
      - uses: actions/checkout@v4
      - name: Performance smoke
        run: npm run validate:week25 || true
