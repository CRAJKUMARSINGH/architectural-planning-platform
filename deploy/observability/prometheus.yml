global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'architectural-planning-platform-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          app: 'architectural-planning-platform-api'
          environment: 'production'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          app: 'otel-collector'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
