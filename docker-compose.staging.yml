# E09 — Staging-like stack (non-local env)
# Override for production-closer settings.
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
#
# IMPORTANT: AUTH_DISABLED must NOT be set here — auth is always required in staging.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-advocate}
    volumes:
      - pgdata-staging:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-advocate-artifacts}
      JWT_SECRET: ${JWT_SECRET}
      ENV: staging
      # AUTH_DISABLED must be absent / false in staging — enforced by startup check
    restart: unless-stopped
    deploy:
      replicas: 2

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-advocate-artifacts}
      ENV: staging
    restart: unless-stopped
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL}
    restart: unless-stopped

volumes:
  pgdata-staging:
