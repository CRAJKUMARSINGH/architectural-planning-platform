[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advocate-chambers"
version = "1.0.0"
description = "Deterministic architectural planning and validation platform."
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
worker = [
  "redis>=5,<6",
]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
  "CAD-Drawings",
  "Jamuniya-Shaktawat",
  "bar-association-hall/CAD",
  "bar-association-hall/PDF",
  "bar-association-hall/standard",
  "code-junction",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = "(^|/)(CAD-Drawings|Jamuniya-Shaktawat|bar-association-hall/standard|code-junction)(/|$)"

[tool.setuptools]
packages = []